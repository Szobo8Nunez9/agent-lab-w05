<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Break Picker</title>
  <style>
    :root { --ink:#17233b; --muted:#667085; --line:#dce3ef; --paper:#fff; --wash:#f4f7fb; --blue:#3166d4; --blue-dark:#21499f; --mint:#dff6ed; --peach:#fff0dc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:linear-gradient(145deg,#f3f7ff 0%,#fffaf2 100%); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
    .shell { width:min(1040px,calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:26px; }
    .eyebrow { margin:0 0 8px; color:var(--blue); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem,5vw,3.8rem); line-height:1.02; letter-spacing:-.05em; }
    .intro { max-width:570px; margin:14px 0 0; color:var(--muted); font-size:1.02rem; line-height:1.6; }
    button, select { font:inherit; }
    button { min-height:48px; cursor:pointer; border:0; }
    .language { display:flex; padding:4px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.8); }
    .language button { padding:8px 13px; color:var(--muted); background:transparent; border-radius:999px; font-size:.85rem; font-weight:700; }
    .language button.active { color:#fff; background:var(--ink); }
    .layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr); gap:20px; align-items:start; }
    .card { padding:24px; border:1px solid rgba(220,227,239,.9); border-radius:24px; background:rgba(255,255,255,.88); box-shadow:0 18px 50px rgba(42,61,96,.08); }
    .filters { display:grid; gap:18px; }
    .filter-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    label { display:block; margin-bottom:8px; font-size:.86rem; font-weight:800; }
    select { width:100%; min-height:48px; padding:13px 14px; color:var(--ink); border:1px solid var(--line); border-radius:12px; background:var(--wash); outline:none; }
    select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(49,102,212,.14); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:2px; }
    .primary { flex:1 1 180px; padding:14px 18px; color:#fff; background:var(--blue); border-radius:12px; font-weight:800; transition:transform .15s,background .15s; }
    .primary:hover { background:var(--blue-dark); transform:translateY(-1px); }
    .secondary { padding:13px 16px; color:var(--ink); background:var(--wash); border:1px solid var(--line); border-radius:12px; font-weight:700; }
    .secondary:hover { background:#eaf0fa; }
    .result { min-height:265px; display:flex; flex-direction:column; justify-content:center; background:var(--ink); color:#fff; overflow:hidden; position:relative; }
    .result::after { content:""; position:absolute; width:170px; height:170px; right:-65px; top:-65px; border-radius:50%; background:#31579e; opacity:.55; }
    .result > * { position:relative; z-index:1; }
    .result .kicker { margin:0 0 13px; color:#b8c9ed; font-size:.78rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; }
    .result h2 { margin:0 0 20px; font-size:clamp(1.6rem,3vw,2.2rem); line-height:1.2; overflow-wrap:anywhere; }
    .details { display:flex; flex-wrap:wrap; gap:8px; }
    .pill { padding:7px 10px; color:#e6edff; background:rgba(255,255,255,.12); border-radius:999px; font-size:.84rem; }
    .empty { color:#dbe4f8; line-height:1.5; }
    .history-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px; }
    .history-head h2 { margin:0; font-size:1.15rem; }
    .history-head button { color:var(--blue); background:none; font-size:.85rem; font-weight:800; }
    .history-head button:disabled { color:#aab4c6; cursor:not-allowed; }
    .history-list { display:grid; gap:9px; margin:0; padding:0; list-style:none; }
    .history-item { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
    .history-id { display:grid; place-items:center; min-width:42px; height:32px; color:var(--blue-dark); background:#e9f0ff; border-radius:8px; font-size:.76rem; font-weight:800; }
    .history-name { min-width:0; flex:1; font-size:.9rem; line-height:1.35; overflow-wrap:anywhere; }
    .history-time { color:var(--muted); font-size:.8rem; white-space:nowrap; }
    .history-empty { margin:0; color:var(--muted); font-size:.9rem; }
    footer { margin-top:19px; color:var(--muted); font-size:.78rem; text-align:center; }
    @media (max-width:700px) { .shell { width:min(100% - 22px,560px); padding-top:20px; } header { display:block; } .language { width:max-content; margin-top:18px; } .layout { grid-template-columns:1fr; } .card { padding:20px; border-radius:20px; } .filter-row { grid-template-columns:1fr; gap:0; } .result { min-height:220px; } }
    @media (max-width:420px) {
      .shell { width:calc(100% - 16px); padding:16px 0 32px; }
      header { margin-bottom:18px; }
      h1 { font-size:clamp(1.85rem,10vw,2.5rem); line-height:1.08; letter-spacing:-.04em; }
      .intro { margin-top:10px; font-size:.98rem; line-height:1.55; }
      .language { margin-top:14px; }
      .card { padding:16px; border-radius:16px; }
      .filters { gap:15px; }
      .filter-row { gap:0; }
      label { margin-bottom:6px; font-size:.9rem; }
      select { padding:12px; }
      .actions { display:grid; gap:10px; }
      .primary, .secondary { width:100%; padding:12px 16px; }
      .result { min-height:210px; }
      .result h2 { margin-bottom:16px; font-size:clamp(1.45rem,8vw,1.9rem); line-height:1.25; }
      .result .kicker { margin-bottom:10px; }
      .pill { padding:7px 9px; font-size:.82rem; }
      .history-head { align-items:flex-start; gap:8px; }
      .history-head h2 { font-size:1.08rem; }
      .history-head button { flex:0 0 auto; padding:0; font-size:.82rem; }
      .history-item { align-items:flex-start; gap:8px; padding:10px 0; }
      .history-id { min-width:38px; height:32px; }
      .history-name { font-size:.88rem; }
      .history-time { padding-top:2px; font-size:.76rem; }
      footer { line-height:1.45; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow" data-i18n="eyebrow">Campus break / 校園休息</p>
        <h1 data-i18n="title">Pick your next break</h1>
        <p class="intro" data-i18n="intro">A small, thoughtful activity for the time you have between classes.</p>
      </div>
      <div class="language" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en" class="active">EN</button>
      </div>
    </header>

    <section class="layout">
      <div class="card filters">
        <div class="filter-row">
          <div><label for="location" data-i18n="locationLabel">Location</label><select id="location"><option value="all" data-i18n="allLocations">All locations</option><option value="indoor" data-i18n="indoor">Indoor</option><option value="outdoor" data-i18n="outdoor">Outdoor</option></select></div>
          <div><label for="minutes" data-i18n="timeLabel">Available time</label><select id="minutes"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">60 min</option></select></div>
        </div>
        <div><label for="energy" data-i18n="energyLabel">Energy</label><select id="energy"><option value="all" data-i18n="allEnergy">All energy levels</option><option value="low" data-i18n="low">Low</option><option value="medium" data-i18n="medium">Medium</option></select></div>
        <div class="actions"><button class="primary" id="pick" type="button" data-i18n="pick">Pick an activity</button><button class="secondary" id="reset" type="button" data-i18n="reset">Reset filters</button></div>
      </div>

      <div class="card result" aria-live="polite" id="result"><p class="kicker" data-i18n="suggestion">Your suggestion</p><p class="empty" data-i18n="emptyResult">Choose your filters, then pick an activity.</p></div>
      <div class="card history"><div class="history-head"><h2 data-i18n="historyTitle">Recent picks</h2><button type="button" id="clear" data-i18n="clear" disabled>Clear history</button></div><ol class="history-list" id="historyList"><li class="history-empty" data-i18n="historyEmpty">Successful picks will appear here.</li></ol></div>
    </section>
    <footer data-i18n="disclaimer">Fictional teaching activities; not an official university announcement.</footer>
  </main>

  <script>
    // Data copied from activities.json; this page intentionally makes no network requests.
    const activities = [
      {id:"A01",name_zh:"整理書包",name_en:"Organize your bag",location_type:"indoor",minutes:10,energy:"low"},
      {id:"A02",name_zh:"畫一張小卡",name_en:"Draw a small card",location_type:"indoor",minutes:15,energy:"low"},
      {id:"A03",name_zh:"寫三句讀書筆記",name_en:"Write three study notes",location_type:"indoor",minutes:10,energy:"low"},
      {id:"A04",name_zh:"安靜讀兩頁書",name_en:"Read two pages quietly",location_type:"indoor",minutes:15,energy:"low"},
      {id:"A05",name_zh:"排好明日待辦",name_en:"Plan tomorrow’s tasks",location_type:"indoor",minutes:20,energy:"low"},
      {id:"A06",name_zh:"整理本機練習檔",name_en:"Organize practice files",location_type:"indoor",minutes:30,energy:"medium"},
      {id:"A07",name_zh:"在合適位置慢走",name_en:"Take a gentle walk in a suitable area",location_type:"outdoor",minutes:15,energy:"low"},
      {id:"A08",name_zh:"觀察天空並畫草圖",name_en:"Observe the sky and sketch",location_type:"outdoor",minutes:20,energy:"low"},
      {id:"A09",name_zh:"在合適位置快走",name_en:"Take a brisk walk in a suitable area",location_type:"outdoor",minutes:30,energy:"medium"},
      {id:"A10",name_zh:"規劃小組練習",name_en:"Plan a group exercise",location_type:"indoor",minutes:45,energy:"medium"},
      {id:"A11",name_zh:"記錄自然色彩",name_en:"Record colors in nature",location_type:"outdoor",minutes:45,energy:"low"},
      {id:"A12",name_zh:"構思下一次社團活動",name_en:"Brainstorm a future club activity",location_type:"indoor",minutes:60,energy:"medium"}
    ];
    const copy = {
      en:{eyebrow:"Campus break / 校園休息",title:"Pick your next break",intro:"A small, thoughtful activity for the time you have between classes.",locationLabel:"Location",allLocations:"All locations",indoor:"Indoor",outdoor:"Outdoor",timeLabel:"Available time",energyLabel:"Energy",allEnergy:"All energy levels",low:"Low",medium:"Medium",pick:"Pick an activity",reset:"Reset filters",suggestion:"Your suggestion",emptyResult:"Choose your filters, then pick an activity.",noMatch:"No matching activities.",historyTitle:"Recent picks",clear:"Clear history",historyEmpty:"Successful picks will appear here.",disclaimer:"Fictional teaching activities; not an official university announcement.",location:{indoor:"Indoor",outdoor:"Outdoor"},energy:{low:"Low",medium:"Medium"}},
      zh:{eyebrow:"校園休息 / Campus break",title:"挑選你的課間活動",intro:"利用課堂之間的時間，做一件小而有意義的事。",locationLabel:"地點",allLocations:"所有地點",indoor:"室內",outdoor:"室外",timeLabel:"可用時間",energyLabel:"活力",allEnergy:"所有活力程度",low:"低",medium:"中",pick:"隨機挑選活動",reset:"重設篩選",suggestion:"為你推薦",emptyResult:"選擇篩選條件，再挑選活動。",noMatch:"沒有符合的活動。",historyTitle:"最近挑選",clear:"清除紀錄",historyEmpty:"成功挑選的活動會顯示在這裡。",disclaimer:"虛構教學活動；並非校方正式公告。",location:{indoor:"室內",outdoor:"室外"},energy:{low:"低活力",medium:"中活力"}}
    };
    let lang="en", history=[];
    const $=id=>document.getElementById(id);
    function t(key){return copy[lang][key]||key;}
    function renderLanguage(){ document.documentElement.lang=lang==="zh"?"zh-Hant":"en"; document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n)); document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang)); renderHistory(); }
    function renderHistory(){ const list=$("historyList"), clear=$("clear"); clear.disabled=!history.length; list.innerHTML=history.length?history.map(a=>`<li class="history-item"><span class="history-id">${a.id}</span><span class="history-name">${lang==="zh"?a.name_zh:a.name_en}</span><span class="history-time">${a.minutes} min</span></li>`).join(""): `<li class="history-empty">${t("historyEmpty")}</li>`; }
    function renderResult(message){ $("result").innerHTML=`<p class="kicker">${t("suggestion")}</p><p class="empty">${message}</p>`; }
    $("pick").addEventListener("click",()=>{ const location=$("location").value, limit=Number($("minutes").value), energy=$("energy").value; const matches=activities.filter(a=>(location==="all"||a.location_type===location)&&a.minutes<=limit&&(energy==="all"||a.energy===energy)); if(!matches.length){renderResult(t("noMatch"));return;} const a=matches[Math.floor(Math.random()*matches.length)]; history=[a,...history].slice(0,5); $("result").innerHTML=`<p class="kicker">${t("suggestion")}</p><h2>${lang==="zh"?a.name_zh:a.name_en}</h2><div class="details"><span class="pill">${a.id}</span><span class="pill">${a.minutes} min</span><span class="pill">${copy[lang].location[a.location_type]}</span><span class="pill">${copy[lang].energy[a.energy]}</span></div>`; renderHistory(); });
    $("clear").addEventListener("click",()=>{history=[];renderHistory();});
    $("reset").addEventListener("click",()=>{$("location").value="all";$("minutes").value="30";$("energy").value="all";});
    document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;renderLanguage();}));
    renderLanguage();
  </script>
</body>
</html>
